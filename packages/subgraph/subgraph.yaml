# Manifest de The Graph para indexar P2PEscrow (nativo) y P2PEscrowERC20 (USDT/USDC).
# Reemplazá address y startBlock por los valores de tu red antes de build/deploy.
# Para ERC20: pon la dirección del escrow USDT (y/o USDC) desplegado con deploy-erc20-all.

specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: P2PEscrow
    network: ganache
    source:
      address: "0x13c764643E05b8866c7935E18e7DFC76A6f06413"
      abi: P2PEscrow
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Escrow
      abis:
        - name: P2PEscrow
          file: ./abis/P2PEscrow.json
      eventHandlers:
        - event: Funded(indexed bytes32,indexed address,indexed address,uint256)
          handler: handleFunded
        - event: Released(indexed bytes32)
          handler: handleReleased
        - event: Refunded(indexed bytes32)
          handler: handleRefunded

  - kind: ethereum/contract
    name: P2PEscrowERC20
    network: ganache
    source:
      # Dirección del P2PEscrowERC20 (USDT o USDC). Salida de deploy-erc20-all.ts
      address: "0x40d5B60dA685a57b5EbfC22e77e9441fF781c229"
      abi: P2PEscrowERC20
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Escrow
      abis:
        - name: P2PEscrowERC20
          file: ./abis/P2PEscrowERC20.json
      eventHandlers:
        - event: Funded(indexed bytes32,indexed address,indexed address,uint256)
          handler: handleFundedERC20
        - event: Released(indexed bytes32)
          handler: handleReleasedERC20
        - event: Refunded(indexed bytes32)
          handler: handleRefundedERC20
